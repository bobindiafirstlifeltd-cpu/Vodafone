<!DOCTYPE html>
<!--
  DEPLOY NOTES (GitHub Pages / any static host):
  1. This is a single static file — GitHub Pages, Netlify, Vercel, etc. all work as-is.
     GitHub Pages: push this file as index.html to a repo → Settings → Pages →
     Deploy from branch → root. It's served over HTTPS automatically, which
     Razorpay Checkout requires.
  2. Two placeholders MUST be filled in below (search for them) or features
     will silently no-op with a toast telling you what's missing:
       - BACKEND_URL     → your deployed Google Apps Script Web App URL
       - RAZORPAY_KEY_ID → your Razorpay Key ID (Settings → API Keys)
  3. Login/loading speed is dominated by Google Apps Script's own response
     time (each call re-opens the Sheet), not by this front-end. This file
     already minimizes round trips (parallel requests, local caching of last
     known data, no CORS-preflight-triggering headers). If it's still slow,
     the fix is on the Apps Script side: cache reads with CacheService,
     avoid getDataRange() on the whole sheet for every call, and — biggest
     win — have the "login" action return the user's contacts in the same
     response so this app can skip the separate getcontacts round trip.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08111d" />
<title>Cloud Call Master — Smart Calling Suite</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#08111d; --panel:#101a33; --panel2:#16213d; --line:rgba(255,255,255,.10);
  --text:#f3f7ff; --muted:#9fb0d1; --gold:#f5c542; --green:#25d366; --blue:#60a5fa;
  --red:#ff6476; --orange:#ff9f43; --purple:#b58cff; --shadow:0 16px 40px rgba(0,0,0,.28);
  --radius:22px; --radius2:16px; --base:16px; --dock-h:74px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at top left, rgba(245,197,66,.16), transparent 28%),
             radial-gradient(circle at top right, rgba(96,165,250,.10), transparent 24%),
             linear-gradient(180deg,#060b13 0%, var(--bg) 45%, #060910 100%);
  color:var(--text); font-size:var(--base); -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
a{color:inherit}
.hidden{display:none!important}
.wrap{max-width:1300px;margin:0 auto;padding:14px 12px 32px}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));
  border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(12px);border-radius:var(--radius)}
.topbar{position:sticky;top:0;z-index:80;display:flex;gap:10px;justify-content:space-between;align-items:center;
  padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),#fff0a3);color:#1b1600;font-weight:900;font-size:19px;flex:0 0 auto;letter-spacing:-.5px}
.title{font-size:18px;font-weight:900;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.usage-badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  background:rgba(9,14,25,.75);border:1px solid var(--line);font-size:11px;color:var(--muted);
}
.usage-badge b{color:var(--gold);font-size:12px}
.usage-badge .x{cursor:pointer;color:var(--muted);font-weight:900;padding-left:2px}
.usage-badge .x:hover{color:var(--red)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;cursor:pointer;text-decoration:none;border-radius:14px;padding:12px 14px;font-weight:800;
  color:#07111e;background:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center;
  transition:transform .12s ease,filter .12s ease;min-height:44px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0);filter:brightness(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.small{padding:9px 12px;min-height:38px;font-size:13px;border-radius:12px}
.btn.tiny{padding:6px 9px;min-height:30px;font-size:11px;border-radius:10px}
.btn.primary{background:linear-gradient(135deg,var(--gold),#ffe58f)}
.btn.green{background:linear-gradient(135deg,#2fe07b,#76f1ab)}
.btn.blue{background:linear-gradient(135deg,#73b3ff,#a9d5ff)}
.btn.purple{background:linear-gradient(135deg,#c6a6ff,#e4d3ff)}
.btn.red{background:linear-gradient(135deg,#ff7b8b,#ff9cab)}
.btn.dark{background:#16213d;color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.full{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#0b1324;color:var(--text);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.icon-btn:hover{border-color:rgba(245,197,66,.4)}

.grid{display:grid;gap:14px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.panel{padding:14px}
.section{padding:14px;margin-bottom:14px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#b8c7e8;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;color:var(--muted);margin:8px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;border-radius:12px;
  border:1px solid rgba(255,255,255,.10);background:#0b1324;color:var(--text);padding:12px;outline:none}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:rgba(245,197,66,.45)}
textarea{min-height:90px;resize:vertical}
.notice{font-size:13px;line-height:1.5;padding:11px 13px;background:rgba(96,165,250,.10);
  border:1px solid rgba(96,165,250,.18);border-radius:14px;color:#deebff}
.notice.warn{background:rgba(255,159,67,.10);border-color:rgba(255,159,67,.22);color:#ffe6cc}
.danger{background:rgba(255,100,118,.10);border-color:rgba(255,100,118,.18);color:#ffdfe3}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .n{font-size:22px;font-weight:900}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px}

.progress-track{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffe58f);border-radius:999px;transition:width .3s ease}

.call-card{background:linear-gradient(180deg,rgba(245,197,66,.10),rgba(255,255,255,.04));
  border:1px solid rgba(245,197,66,.20);border-radius:22px;padding:16px;position:relative}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:24px;font-weight:900}
.phone-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.phone{display:inline-flex;gap:8px;align-items:center;font-size:24px;font-weight:900;text-decoration:none;
  color:#fff8d0;word-break:break-word}
.copy-chip{border:1px solid var(--line);background:#0b1324;color:var(--muted);border-radius:10px;padding:6px 9px;
  font-size:11px;cursor:pointer;font-weight:700}
.copy-chip:hover{color:var(--gold);border-color:rgba(245,197,66,.4)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tab{padding:9px 11px;border-radius:999px;background:#0b1324;color:var(--text);border:1px solid rgba(255,255,255,.10);
  cursor:pointer;font-size:12px;font-weight:800;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .12s ease}
.tab:active{transform:scale(.96)}
.tab.active{background:linear-gradient(135deg,rgba(245,197,66,.96),rgba(255,229,143,.96));color:#1b1600;border-color:transparent}

/* ---- Card entrance (subtle, not distracting) ---- */
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.call-card{animation:cardIn .22s ease}

/* ---- Save status pill: Saving… / Saved / Failed ---- */
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 11px;
  border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);
  transition:background .18s ease,color .18s ease,border-color .18s ease}
.save-pill.saving{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.3);color:#cfe3ff}
.save-pill.saving .dot{width:7px;height:7px;border-radius:999px;background:#60a5fa;animation:pulseDot 1s ease-in-out infinite}
.save-pill.saved{background:rgba(37,211,102,.16);border-color:rgba(37,211,102,.32);color:#b6f5d0}
.save-pill.error{background:rgba(255,100,118,.14);border-color:rgba(255,100,118,.3);color:#ffd3d9}
@keyframes pulseDot{0%,100%{opacity:.35}50%{opacity:1}}

/* ---- User Base lookup ---- */
.userbase-box{border:1px solid rgba(245,197,66,.22);background:rgba(245,197,66,.06);border-radius:16px;padding:12px;margin-bottom:14px}
.userbase-row{display:flex;gap:8px}
.userbase-row input{flex:1;min-width:0}
.userbase-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);min-width:0}
.kv .k{font-size:11px;color:var(--muted);margin-bottom:3px}
.kv .v{font-size:14px;font-weight:700;word-break:break-word}
.kv.full{grid-column:1/-1}
.remarks-wrap{position:relative}
.save-flag{position:absolute;top:-8px;right:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
  background:rgba(255,159,67,.18);color:#ffdcae;border:1px solid rgba(255,159,67,.3)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions .btn{min-height:48px}
.actions-row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}

.list{max-height:calc(100vh - 300px);overflow:auto;padding-right:4px}
.record{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);margin-bottom:8px;cursor:pointer;position:relative}
.record.active{outline:2px solid rgba(245,197,66,.34);background:rgba(245,197,66,.08)}
.record .nm{font-size:14px;font-weight:900}
.record .ph{font-size:11px;color:var(--muted);margin-top:3px}
.record .rmeta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.record .hide-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.record .hide-x:hover{color:var(--red)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:5px 9px;
  border-radius:999px;background:#0b1324;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800}
.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}
table{width:100%;min-width:820px;border-collapse:collapse;background:rgba(255,255,255,.03)}
th,td{border-bottom:1px solid rgba(255,255,255,.08);padding:9px 10px;font-size:12px;text-align:left}
th{position:sticky;top:0;background:#0d1630}
tr.row-hidden{opacity:.4}
tr.row-active{background:rgba(245,197,66,.10)}

/* ---- Auto Call ---- */
.autocall-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 16px;margin-bottom:14px;border:1px solid rgba(245,197,66,.22)}
.autocall-banner.active{border-color:rgba(37,211,102,.35);background:rgba(37,211,102,.06)}
.ac-title{font-weight:900;letter-spacing:.02em;font-size:13px}
.ac-cust{font-weight:800;margin-top:2px}
.ac-actions{display:flex;gap:8px;flex-wrap:wrap}
.ac-locked{opacity:.45;pointer-events:none}
.disposition-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.disposition-grid .disp-btn{min-height:56px;font-size:14px;white-space:normal}
@media (max-width:420px){ .disposition-grid{grid-template-columns:1fr} }
.toast{position:fixed;right:14px;bottom:20px;z-index:9999;background:rgba(9,14,25,.96);color:var(--text);
  border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;min-width:220px;
  max-width:340px;display:none}
.toast.show{display:block;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.2}to{transform:translateY(0);opacity:1}}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:18px 12px}
.login-box{width:100%;max-width:420px;padding:20px}
.login-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
.role-toggle{display:flex;gap:8px;margin-bottom:14px}
.role-toggle button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0b1324;
  color:var(--text);cursor:pointer;font-weight:800;font-size:13px}
.role-toggle button.on{background:linear-gradient(135deg,var(--gold),#ffe58f);color:#1b1600}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;
  background:rgba(255,255,255,.08);color:var(--muted)}
.tag.admin{background:rgba(245,197,66,.18);color:#ffe9a8}

/* ---- Queue drawer (mobile-first hide/show) ---- */
.queue-toggle{display:none}
.drawer-overlay{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .list{max-height:none}
  .queue-toggle{display:inline-flex}
  aside.queue-drawer{
    position:fixed; top:0; right:0; height:100dvh; width:min(340px,86vw); z-index:220;
    transform:translateX(100%); transition:transform .26s ease; border-radius:0; overflow-y:auto;
    padding-bottom:calc(20px + var(--safe-b));
  }
  aside.queue-drawer.open{transform:translateX(0)}
  .drawer-overlay{display:block;position:fixed;inset:0;background:rgba(3,6,12,.55);z-index:210;opacity:0;
    pointer-events:none;transition:opacity .2s ease}
  .drawer-overlay.open{opacity:1;pointer-events:auto}
  .drawer-close{display:inline-flex}
}
.drawer-close{display:none}

/* ---- Mobile bottom action dock ---- */
.mobile-dock{display:none}
@media (max-width:720px){
  .mobile-dock{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px; position:fixed; left:0; right:0; bottom:0; z-index:150;
    padding:8px 8px calc(8px + var(--safe-b)); background:rgba(9,14,25,.94); border-top:1px solid var(--line);
    backdrop-filter:blur(14px);
  }
  .mobile-dock button, .mobile-dock a{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0;
    border-radius:12px; padding:8px 2px; font-size:10px; font-weight:800; text-decoration:none; color:var(--text);
    background:rgba(255,255,255,.06); min-height:56px;
  }
  .mobile-dock .ic{font-size:17px}
  .mobile-dock .dock-call{background:linear-gradient(135deg,#2fe07b,#76f1ab);color:#07220f}
  .mobile-dock .dock-save{background:linear-gradient(135deg,var(--gold),#ffe58f);color:#1b1600}
  .wrap{padding-bottom:calc(var(--dock-h) + 24px)}
  .actions,.actions-row2{display:none}
}

@media (max-width:640px){
  .name{font-size:20px} .phone{font-size:20px}
  .data{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  table{min-width:680px}
  .title{font-size:16px}
}

/* ---- Back button ---- */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:#0b1324;color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer}
.back-btn:hover{border-color:rgba(245,197,66,.4)}

/* ---- Plan / package card ---- */
.plan-card{position:relative;overflow:hidden;border-radius:22px;padding:20px;
  background:linear-gradient(160deg,rgba(245,197,66,.16),rgba(96,165,250,.06));
  border:1px solid rgba(245,197,66,.28)}
.plan-card .plan-badge{position:absolute;top:14px;right:14px;background:linear-gradient(135deg,var(--green),#76f1ab);
  color:#07220f;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px}
.plan-card .plan-price{font-size:34px;font-weight:900;color:var(--gold);display:flex;align-items:baseline;gap:6px}
.plan-card .plan-price span{font-size:14px;color:var(--muted);font-weight:700}
.plan-card .plan-name{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#ffe9a8;font-weight:800;margin-bottom:6px}
.plan-card ul{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.9}
.plan-card ul li b{color:var(--text)}

/* ---- Completion / repurchase banner ---- */
.repurchase-banner{background:linear-gradient(160deg,rgba(37,211,102,.16),rgba(96,165,250,.06));
  border:1px solid rgba(37,211,102,.3);border-radius:20px;padding:16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.repurchase-banner .r-text b{display:block;font-size:15px}
.repurchase-banner .r-text span{font-size:12px;color:var(--muted)}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,.72);z-index:400;display:flex;
  align-items:center;justify-content:center;padding:16px}
.modal-box{width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;position:relative}
.modal-close{position:absolute;top:12px;right:12px}
.credential-card{border:1px solid rgba(245,197,66,.35);border-radius:16px;padding:16px;margin-top:14px;
  background:rgba(245,197,66,.08)}
.credential-card .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  border-bottom:1px dashed var(--line)}
.credential-card .row:last-child{border-bottom:0}
.credential-card .cl{font-size:11px;color:var(--muted)}
.credential-card .cv{font-size:16px;font-weight:900;color:var(--gold);word-break:break-all}

/* ---- Bulk WhatsApp ---- */
.bulkwa-current{background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.25);border-radius:16px;
  padding:14px;margin-top:10px}
.bulkwa-current .bw-name{font-size:17px;font-weight:900}
.bulkwa-current .bw-phone{font-size:13px;color:var(--muted);margin-top:2px}
.bulkwa-list{max-height:180px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
.bulkwa-list .bwrow{display:flex;justify-content:space-between;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--line)}
.bulkwa-list .bwrow:last-child{border-bottom:0}
.bulkwa-list .bwrow.sent{opacity:.4;text-decoration:line-through}

/* ---- Corner logout ---- */
.corner-logout{position:fixed;top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));
  z-index:500;display:flex;align-items:center;gap:6px;background:#0b1324;color:var(--text);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.corner-logout:hover{border-color:rgba(255,100,118,.5);color:#ffdfe3}
@media (max-width:640px){ .corner-logout{padding:7px 11px;font-size:11px} }

/* ---- Corner "buy access" button on the welcome/login screen ---- */
.corner-buy{position:fixed;top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));
  z-index:500;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold),#ffe58f);
  color:#241a00;border:none;border-radius:999px;padding:9px 16px;font-weight:900;font-size:12px;
  cursor:pointer;box-shadow:0 8px 22px rgba(245,197,66,.35)}
.corner-buy:hover{filter:brightness(1.05)}
@media (max-width:640px){ .corner-buy{padding:8px 12px;font-size:11px} }

/* ---- Report modal ---- */
.report-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.report-stat-grid .rs{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.report-stat-grid .rs .n{font-size:20px;font-weight:900;color:var(--gold)}
.report-stat-grid .rs .l{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>

<script>
(() => {
/* =====================================================================
   1) PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW (see setup guide)
   Backend/server logic is untouched — only client action names are used.
   ===================================================================== */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzE8VZea3c0aEKiFkOXAkvBCZf8fW-tTd4JTT1qyLap2Tyopj4fIUSkMFYpPzaAmbB_pw/exec";

const LS_SESSION = "ccm_session_v1";
const LS_HIDDEN_PREFIX = "ccm_hidden_"; // + username -> array of contact IDs hidden from that user's queue (admin fallback only)
const LS_DRAFT_PREFIX = "ccm_draft_";   // + username -> {id: remarksText} unsent remarks drafts
const LS_QUEUE_RETRY = "ccm_retry_queue_v1"; // failed updates waiting to sync
const LS_PROFILE_PREFIX = "ccm_sharelink_"; // + key + username -> saved shareable link
const LS_CACHE_CONTACTS_PREFIX = "ccm_cache_contacts_"; // + username -> {contacts, ts} last-known data for instant reload
const LS_LASTPOS_PREFIX = "ccm_lastpos_"; // + username -> ID of the contact the user was last viewing/calling
const LS_AUTOCALL_STATE_PREFIX = "ccm_autocall_state_"; // + username -> persisted Auto Call resume state (see saveAutoCallState)

/* ---------------------- Resume where you left off ----------------------
   Whenever the active contact card changes (opened, Next/Prev, tapped in
   the list), we remember its ID. Next time this user logs in — even on a
   different day or after closing the tab — the queue opens back on that
   same contact instead of resetting to the top of the list. */
function lastPosKey(){ return LS_LASTPOS_PREFIX + (session ? session.username : ""); }
function saveLastPosition(id){ if(id!=null) localStorage.setItem(lastPosKey(), String(id)); }

    // Call resume position is deliberately NOT cleared here — it must

    if(session){
      try{
        localStorage.removeItem(contactsCacheKey());
        localStorage.removeItem(lastPosKey());

const STATUS_OPTIONS = ["Pending","Interested","Not Interested","Callback","Busy","Wrong Number","No Answer","Dropped","Follow Up","Do Not Call","Closed"];

/* =====================================================================
   AUTO CALL FEATURE
   Steps a field user through their eligible queue one lead at a time:
   dial (existing tel: mechanism) -> user returns from the phone app ->
   log a result -> auto-advance to the next lead. Reuses telNumber(),
   saveRecord(), STATUS_OPTIONS and the existing modal-overlay pattern —
   no parallel data path, no new backend calls.

   RESUME STATE: persisted to localStorage per logged-in username (same
   pattern as LS_LASTPOS_PREFIX/LS_DRAFT_PREFIX elsewhere in this file),
   keyed by contact ID rather than array index — indexes shift whenever
   filters/search/assignment change, IDs don't. Saved immediately on every
   meaningful transition (call started, call ended, disposition saved,
   next contact loaded, stopped) so a refresh/logout/crash never loses
   more than the single call in flight. Never auto-resumed by itself on
   load — the user always presses Start Auto Call, which then continues
   from this saved position (see startAutoCall below).

   HONEST LIMITATION: a browser cannot detect when a phone call actually
   connects or ends — that happens entirely inside the native dialer,
   outside the page. The best available signal is the Page Visibility
   API: when the tab becomes visible again after being backgrounded (the
   user leaving for/returning from the dialer), we treat that as "the
   call is over" and show the result popup. This is reliable on most
   Android browsers but not guaranteed on every device/WebView, so a
   manual "I'm back — log this call" button is always shown as a
   fallback while waiting.
   ===================================================================== */
const AUTO_CALL_TERMINAL_STATUSES = ["Not Interested","Do Not Call","Closed","Wrong Number"];
const AUTO_CALL_MIN_AWAY_MS = 1200; // ignore instant visibility flips (accidental tab switches)

let autoCall = {
  active: false,        // Stop sets this false immediately, from any phase
  runId: 0,               // bumped on every Start; async callbacks check it to avoid acting on a stopped/older run
  queue: [],                // snapshot of eligible leads for this run, positioned by ID — see startAutoCall
  pos: 0,                     // index of the current/next lead within queue
  processed: 0,                 // calls completed so far this run (display only, not the resume mechanism)
  phase: "idle",                  // idle | dialing | awaiting-return | disposition | followup | saving | save-error | completed
  dialedAt: 0,
  lastProcessedId: null,            // ID of the last contact successfully saved — the resume mechanism's source of truth
  lastAction: null,                   // disposition of the last processed contact, for the persisted record
};

function autoCallStateKey(){ return LS_AUTOCALL_STATE_PREFIX + (session ? session.username : ""); }

/* Called at every meaningful transition (started, contact selected, call
   initiated, call disconnected, disposition saved, follow-up saved,
   contact completed, next loaded, stopped). Cheap synchronous write,
   isolated per username so User A's position never touches User B's. */
function saveAutoCallState(){
  if(!session) return;
  const nextLead = autoCall.queue[autoCall.pos] || null;
  const state = {
    userId: session.username,
    leadId: nextLead ? nextLead.ID : null,   // the contact Auto Call will resume on
    lastProcessedId: autoCall.lastProcessedId,
    processed: autoCall.processed,
    active: autoCall.active,
    phase: autoCall.phase,
    lastAction: autoCall.lastAction,
    updatedAt: Date.now(),
  };
  try{ localStorage.setItem(autoCallStateKey(), JSON.stringify(state)); }catch(e){}
}
function loadAutoCallState(){
  try{ return JSON.parse(localStorage.getItem(autoCallStateKey()) || "null"); }catch(e){ return null; }
}
/* Only clears the saved resume position — never called on logout, only
   from the explicit "Reset Auto Call Position" button after confirmation. */
function clearAutoCallState(){ try{ localStorage.removeItem(autoCallStateKey()); }catch(e){} }

function autoCallIsEligible(c){ return !AUTO_CALL_TERMINAL_STATUSES.includes(c.Status || "Pending"); }

function startAutoCall(){
  if(autoCall.active) return; // guards double-tap / double-bind

  const list = filteredContacts();
  const displayedRec = list[ui.currentIndex] || null;
  const haveLiveQueue = autoCall.queue.length > 0 && autoCall.pos < autoCall.queue.length;
  const liveCurrentId = haveLiveQueue ? String(autoCall.queue[autoCall.pos].ID) : null;
  const jumpedAway = !!(displayedRec && haveLiveQueue && String(displayedRec.ID) !== liveCurrentId);

  if(!haveLiveQueue || jumpedAway){
    // Fresh run, or the user deliberately jumped somewhere else since the
    // last run stopped. Rebuild the eligible queue and pick the starting
    // position with this priority: the currently displayed/jumped contact
    // first, then the previously saved resume position, then the beginning.
    const eligible = visibleContacts().filter(autoCallIsEligible);
    if(!eligible.length){
      showToast("No eligible leads to call — everyone assigned to you is Not Interested, Do Not Call, Closed, or has an invalid number.");
      return;
    }
    autoCall.queue = eligible;
    autoCall.processed = 0;

    let startPos = displayedRec ? eligible.findIndex(c => String(c.ID) === String(displayedRec.ID)) : -1;
    if(startPos < 0){
      const saved = loadAutoCallState();
      const resumeId = saved && saved.leadId != null ? saved.leadId : null;
      if(resumeId != null) startPos = eligible.findIndex(c => String(c.ID) === String(resumeId));
    }
    autoCall.pos = startPos >= 0 ? startPos : 0;

    if(jumpedAway) showToast(`Starting Auto Call from ${displayedRec.Name || ("#"+displayedRec.ID)} — the contact you jumped to.`);
    else if(startPos > 0) showToast("Resuming Auto Call from where you left off.");
  }
  // else: an in-memory run was Stopped mid-way and nothing was jumped since — continue that exact queue/position untouched.

  autoCall.runId += 1;
  const runId = autoCall.runId;
  autoCall.active = true;
  autoCall.phase = "idle";
  ui.statusFilter = "All";
  ui.search = "";
  ui.drawerOpen = false;
  saveAutoCallState();
  renderUser();
  autoCallDialCurrent(runId);
}

/* Explicit, confirmed-only reset — clears the saved resume position so the
   next Start begins from the first eligible contact instead of resuming. */
function resetAutoCallPosition(){
  if(autoCall.active){ showToast("Stop Auto Call before resetting its position."); return; }
  const ok = confirm("Reset Auto Call Position?\n\nThis clears your saved Auto Call progress. Next time you press Start Auto Call, it will begin from the first eligible contact instead of resuming where you left off.");
  if(!ok) return;
  clearAutoCallState();
  autoCall.queue = [];
  autoCall.pos = 0;
  autoCall.processed = 0;
  autoCall.lastProcessedId = null;
  autoCall.lastAction = null;
  goFirstRecord();
  showToast("Auto Call position reset — it will start from the beginning next time.");
}

function stopAutoCall(){
  if(!autoCall.active) return;
  autoCall.active = false;
  autoCall.runId += 1; // invalidate any in-flight visibility/timer callbacks from this run
  if(autoCall.phase === "dialing" || autoCall.phase === "awaiting-return") autoCall.phase = "idle";
  // Note: if a disposition/follow-up popup is already open, we deliberately
  // leave it open — the user can still finish logging that call (rule:
  // "allow the currently active call to finish where technically
  // possible"). Its own save handler checks autoCall.active afterwards and
  // will not auto-dial the next number since it's now false.
  saveAutoCallState();
  showToast("Auto Call stopped. Your place in the queue is saved — press Start Auto Call to continue.");
  renderUser();
}

function autoCallDialCurrent(runId){
  if(runId !== autoCall.runId || !autoCall.active) return;
  if(autoCall.pos >= autoCall.queue.length){ autoCallFinish(runId); return; }
  const rec = autoCall.queue[autoCall.pos];
  if(!autoCallIsEligible(rec)){ autoCall.pos += 1; autoCallDialCurrent(runId); return; } // status changed since queue was built — skip
  const idx = filteredContacts().findIndex(c => String(c.ID) === String(rec.ID));
  if(idx >= 0) ui.currentIndex = idx;

  const num = telNumber(rec.Mobile);
  if(!num || num === "+"){
    showToast(`Skipping ${rec.Name || rec.ID} — no valid mobile number.`);
    autoCallRecordDisposition(rec, "No Answer", rec.Remarks || "", runId);
    return;
  }

  autoCall.phase = "dialing";
  saveAutoCallState(); // "call initiated"
  renderUser();
  autoCall.dialedAt = Date.now();
  autoCall.phase = "awaiting-return";
  window.location.href = "tel:" + num; // same mechanism as the existing manual Call button/link
  renderUser();
}

/* Fires when the user comes back to the tab (Page Visibility API) or taps
   the manual fallback button — either way, this is our best signal that
   the call is over and it's time to log a result. */
function handleAutoCallReturn(manual){
  if(!autoCall.active || autoCall.phase !== "awaiting-return") return;
  if(!manual && (Date.now() - (autoCall.dialedAt||0)) < AUTO_CALL_MIN_AWAY_MS) return;
  const runId = autoCall.runId;
  const rec = autoCall.queue[autoCall.pos];
  if(!rec) return;
  autoCall.phase = "disposition";
  saveAutoCallState(); // "call disconnected"
  renderUser();
  openAutoCallDispositionModal(rec, runId);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") handleAutoCallReturn(false);
  else saveAutoCallState(); // belt-and-braces: also save the instant the tab backgrounds (e.g. right before the dialer takes over)
});
window.addEventListener("pagehide", saveAutoCallState); // safety net for abrupt refresh/close — normal transitions already save immediately

function closeAutoCallModals(){
  ["autoCallDispositionOverlay","autoCallFollowUpOverlay","autoCallSaveErrorOverlay"].forEach(id => {
    const el = document.getElementById(id); if(el) el.remove();
  });
}

        <button class="btn dark disp-btn" data-disp="Not Interested">✖ Not Interested</button>
        <button class="btn primary disp-btn" data-disp="Follow Up">📅 Follow Up</button>
        <button class="btn red disp-btn" data-disp="Do Not Call">🚫 Don't Call</button>

/* Saves via the existing saveRecord() — same duplicate-submission lock,
   same offline retry queue, same Saving/Saved/Failed pill as manual saves.
   Only advances the queue after a confirmed successful save, using the
   contact's ID (not its array index) so nothing can be double-counted if
   the surrounding list is re-filtered mid-flight. */
async function autoCallRecordDisposition(rec, status, remarks, runId){
  if(runId !== autoCall.runId) return; // stale callback from a stopped/older run
  autoCall.phase = "saving";
  autoCall.lastAction = status;
  saveAutoCallState(); // "disposition selected"
  renderUser();
  await saveRecord(rec, status, remarks);
  if(runId !== autoCall.runId) return; // stopped/restarted while the save was in flight

  if(ui.saveState && String(ui.saveState.id) === String(rec.ID) && ui.saveState.phase === "error"){
    autoCall.phase = "save-error";
    saveAutoCallState();
    renderUser();
    openAutoCallSaveErrorModal(rec, status, remarks, runId);
    return;
  }

  // Confirmed saved — this contact is done. Advance by ID, not index.
  autoCall.lastProcessedId = rec.ID;
  autoCall.processed += 1;
  autoCall.pos += 1;
  const nextRec = autoCall.queue[autoCall.pos] || null;
  if(nextRec){
    const nextIdx = filteredContacts().findIndex(c => String(c.ID) === String(nextRec.ID));
    if(nextIdx >= 0) ui.currentIndex = nextIdx; // keep the displayed contact in sync with the resume position
  }
  saveAutoCallState(); // "contact completed" + "next contact loaded"
  if(!autoCall.active){ autoCall.phase = "idle"; renderUser(); return; } // Stop was pressed during the save — honor it, don't dial next
  autoCallDialCurrent(runId);
}

function openAutoCallSaveErrorModal(rec, status, remarks, runId){
  closeAutoCallModals();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "autoCallSaveErrorOverlay";
  overlay.innerHTML = `
    <div class="glass modal-box">
      <div class="section-title"><span>⚠ Unable to Save</span></div>
      <div class="mini" style="margin-bottom:14px">Could not save the result for <b>${esc(rec.Name || rec.ID)}</b> yet — nothing has been lost. Retry, or stop and it'll still be waiting for you.</div>
      <button class="btn primary full" id="autoCallRetrySave">↻ Retry Save</button>
      <button class="btn ghost full" id="autoCallStopFromError" style="margin-top:10px">⏹ Stop Auto Call</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("autoCallRetrySave").onclick = () => { overlay.remove(); autoCallRecordDisposition(rec, status, remarks, runId); };
  document.getElementById("autoCallStopFromError").onclick = () => { overlay.remove(); stopAutoCall(); };
}

function autoCallFinish(runId){
  if(runId !== autoCall.runId) return;
  autoCall.active = false;
  autoCall.phase = "completed";
  saveAutoCallState();
  renderUser();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="glass modal-box" style="text-align:center">
      <div style="font-size:40px;margin-bottom:8px">🎉</div>
      <div class="section-title" style="justify-content:center"><span>Auto Call Completed</span></div>
      <div class="mini" style="margin:10px 0 16px">All eligible assigned contacts have been processed (${autoCall.processed} call${autoCall.processed===1?"":"s"} this run).</div>
      <button class="btn primary full" id="autoCallDoneClose">Done</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => { overlay.remove(); autoCall.phase = "idle"; renderUser(); };
  document.getElementById("autoCallDoneClose").onclick = close;
  overlay.onclick = e => { if(e.target === overlay) close(); };
}

function renderAutoCallBanner(){
  if(!autoCall.active){
    const saved = loadAutoCallState();
    const resumeRec = saved && saved.leadId != null ? autoCall.queue.find(c=>String(c.ID)===String(saved.leadId)) : null;
    const hasResumeInfo = saved && (saved.leadId != null || saved.lastProcessedId != null);
    return `
    <div class="glass autocall-banner">
      <div class="ac-left">
        <div class="ac-title">🚀 AUTO CALL</div>
        <div class="mini">Steps through your eligible leads one at a time — dial, log the result, repeat. You still tap once per call (phones require that); everything after is automatic.</div>

      </div>
      <div class="ac-actions">
        <button id="startAutoCallBtn" class="btn primary">▶ START AUTO CALL</button>
        ${hasResumeInfo ? `<button id="resetAutoCallBtn" class="btn ghost small">↺ Reset Position</button>` : ""}
      </div>
    </div>`;
  }

  }[autoCall.phase] || "Ready…";
  return `

      <div class="mini">Queue: ${Math.min(autoCall.pos+1, autoCall.queue.length)} / ${autoCall.queue.length} &nbsp;·&nbsp; Status: ${esc(phaseLabel)}</div>
    </div>
    <div class="ac-actions">
      ${autoCall.phase === "awaiting-return" ? `<button id="autoCallManualReturnBtn" class="btn dark small">I'm back — log this call</button>` : ""}
      <button id="stopAutoCallBtn" class="btn red small">⏹ STOP AUTO CALL</button>
    </div>
  </div>`;
}

/* =====================================================================
   PAYMENT / SELF-SERVE CONTACT PACKAGE CONFIG
   - PLAN_PRICE_INR / PLAN_CONTACTS define the package shown to buyers.
   - RAZORPAY_KEY_ID must be your own LIVE/TEST Key ID from the Razorpay
     dashboard (Settings → API Keys). It is safe to expose the Key ID in
     client code (that's how Razorpay Checkout works) — never put your
     Key SECRET here. Payment must still be verified on your Apps Script
     backend (signature check) before contacts are handed out; see the
     "selfpurchasecontacts" backend note further down this file.
   ===================================================================== */
const PLAN_PRICE_INR = 100;
const PLAN_CONTACTS  = 500;
const RAZORPAY_KEY_ID = "RAZORPAY_KEY_ID_HERE"; // <-- paste your Razorpay Key ID
const LS_LAST_PURCHASE = "ccm_last_purchase_v1";

/* ---------------------- Login attempt throttling ----------------------
   This is a DEVICE-side speed bump only — it slows down someone guessing
   PINs through this app's own login screen. It cannot stop someone who
   calls BACKEND_URL directly (curl/script), and clearing browser storage
   resets it. Real brute-force protection (rate limiting per IP/username,
   PIN hashing, lockouts that survive across devices) has to live in the
   Apps Script backend — that code isn't part of this file, so it can't
   be added here. This just raises the bar for casual attempts via the UI. */
const LS_LOGIN_ATTEMPTS = "ccm_login_attempts_v1"; // { [username]: { count, lockUntil } }
function getLoginAttempts(){ try{ return JSON.parse(localStorage.getItem(LS_LOGIN_ATTEMPTS) || "{}"); }catch(e){ return {}; } }
function setLoginAttempts(obj){ try{ localStorage.setItem(LS_LOGIN_ATTEMPTS, JSON.stringify(obj)); }catch(e){} }
function loginLockStatus(username){
  const all = getLoginAttempts();
  const rec = all[String(username||"").trim().toLowerCase()];
  if(!rec || !rec.lockUntil || rec.lockUntil <= Date.now()) return { locked:false };
  return { locked:true, msLeft: rec.lockUntil - Date.now() };
}
function recordFailedLogin(username){
  const all = getLoginAttempts();
  const key = String(username||"").trim().toLowerCase();
  const rec = all[key] || { count:0, lockUntil:0 };
  rec.count += 1;
  // Progressive lockout: 5 fails -> 30s, 8 fails -> 2min, 12+ fails -> 10min.
  if(rec.count >= 12) rec.lockUntil = Date.now() + 10*60*1000;
  else if(rec.count >= 8) rec.lockUntil = Date.now() + 2*60*1000;
  else if(rec.count >= 5) rec.lockUntil = Date.now() + 30*1000;
  all[key] = rec;
  setLoginAttempts(all);
}
function clearLoginAttempts(username){
  const all = getLoginAttempts();
  delete all[String(username||"").trim().toLowerCase()];
  setLoginAttempts(all);
}

/* ---------------------- Weak PIN detection ----------------------
   Advisory only — blocks the most guessable PINs (all-same-digit,
   simple runs) from being created through this UI. A determined
   attacker calling the backend directly isn't affected by this either;
   it just stops an admin from accidentally handing out "111111" or
   "123456" to a field user. */
function weakPinReason(pin){
  const p = String(pin||"");
  if(p.length < 6) return "Use at least 6 digits — shorter PINs are much easier to guess.";
  if(/^(\d)\1+$/.test(p)) return "Avoid a repeated digit like 111111 — it's one of the first things guessed.";
  if("0123456789".includes(p) || "9876543210".includes(p)) return "Avoid a simple run like 123456 — it's one of the first things guessed.";
  return null;
}

/* ---------------------- Bulk WhatsApp: sent-tracking (per user, per device) ----------------------
   WhatsApp has no public API for unattended bulk sending — automating the
   final "Send" tap would violate WhatsApp's terms and risk the number
   being banned. This instead gives a fast one-click-per-contact flow: open
   WhatsApp pre-filled → user taps Send in WhatsApp → click "Next" here.
   Each contact is remembered as sent so nobody gets messaged twice. */

function bulkWaKey(){ return LS_BULKWA_PREFIX + (session ? session.username : "guest"); }

function showToast(msg, ms=2600){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.remove("show"), ms);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function saveSession(){ localStorage.setItem(LS_SESSION, JSON.stringify(session)); }

/* Clean a phone number for tel:/wa.me/sms: links.
   Fixes the old bug where numbers already carrying a 91/+91 prefix got a
   second 91 stuck on the front for WhatsApp, breaking the link. */
function cleanNumber(raw){
  let d = String(raw||"").replace(/\D/g,"");
  if(d.length>10 && d.startsWith("0")) d = d.replace(/^0+/,"");
  if(d.length===10) d = "91"+d;
  else if(d.length===11 && d.startsWith("0")) d = "91"+d.slice(1);
  return d; // e.g. 91XXXXXXXXXX — used for wa.me and sms: links (no plus sign)
}
// tel: links need a leading "+" for the country code to dial reliably on most
// phones/carriers — wa.me/sms: must NOT have it, which is why this is separate.
function telNumber(raw){ return "+" + cleanNumber(raw); }
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast("Number copied")).catch(()=>showToast("Could not copy"));
  }else{
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); try{ document.execCommand("copy"); showToast("Number copied"); }catch(e){ showToast("Could not copy"); }
    t.remove();
  }
}

/* Real delete: tries the sheet first (needs a "deletecontact" action in your
   Apps Script). If that action doesn't exist yet, it hides the contact on
   this device instead, so the delete button never silently does nothing. */
async function tryDeleteContact(id){
  const r = await api("deletecontact", { username:session.username, pin:session.pin, id });
  if(r.ok){
    contacts = contacts.filter(c => String(c.ID)!==String(id));
    unhideContact(id);
    return { deletedFromSheet:true };

  hideContact(id);
  return { deletedFromSheet:false };
}

/* ---------------------- offline-safe retry queue ---------------------- */
function getRetryQueue(){ return JSON.parse(localStorage.getItem(LS_QUEUE_RETRY) || "[]"); }
function setRetryQueue(q){ localStorage.setItem(LS_QUEUE_RETRY, JSON.stringify(q)); }
function queueForRetry(payload){
  const q = getRetryQueue(); q.push({ ...payload, ts:Date.now() }); setRetryQueue(q);
}
async function flushRetryQueue(){
  const q = getRetryQueue();
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    try{
      const r = await apiRaw("updatecontact", item);
      if(!r.ok) remaining.push(item);
    }catch(e){ remaining.push(item); }
  }
  setRetryQueue(remaining);
  if(remaining.length < q.length) showToast(`Synced ${q.length - remaining.length} pending update(s)`);
}
window.addEventListener("online", flushRetryQueue);

/* ---------------------- BOOT / ROUTER ----------------------
   Login used to feel slow because every boot() call did THREE things
   back-to-back before anything appeared: (1) getusagecount, (2) render
   login if needed, (3) login, then (4) getcontacts — each a full round
   trip to Google Apps Script (which is inherently a bit slow, often
   1-3s per call on its own). That's 2-3 sequential round trips stacked
   up before the user saw anything. This version:
   - Shows the login screen immediately — never waits on a network call first.
   - Fires getusagecount and getcontacts IN PARALLEL instead of one after another.
   - Instantly shows last-known contacts from local cache (if any) while
     fresh data loads in the background, so re-logins and re-opens feel instant.
   - Times out gracefully with a Retry button instead of hanging forever. */
function contactsCacheKey(){ return LS_CACHE_CONTACTS_PREFIX + (session ? session.username : ""); }
function getCachedContacts(){
  try{ const raw = localStorage.getItem(contactsCacheKey()); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setCachedContacts(list){
  try{ localStorage.setItem(contactsCacheKey(), JSON.stringify({ contacts:list, ts:Date.now() })); }catch(e){}
}
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} is taking too long — Google Sheets may be slow to respond right now.`)), ms))
  ]);
}

async function boot(){
  if(!session){ renderLogin(); return; }

  // Show cached data instantly (if we have any) so the screen never sits
  // blank while we wait on the network — then refresh it underneath.
  const cached = getCachedContacts();
  if(cached && Array.isArray(cached.contacts)){
    contacts = cached.contacts;
    render();
  } else {
    app.innerHTML = `<div class="wrap"><div class="notice" id="bootNotice">Loading your data from Google Sheet…</div></div>`;
  }

  let slowTimer = setTimeout(() => {
    const el = document.getElementById("bootNotice");
    if(el) el.innerHTML = `Still connecting to Google Sheets — first load can take a few seconds… <button id="bootRetryBtn" class="btn dark small" style="margin-left:8px">Retry</button>`;
    const rb = document.getElementById("bootRetryBtn");
    if(rb) rb.onclick = boot;
  }, 5000);

  try{
    const [contactsRes, usageRes] = await Promise.all([
      withTimeout(api("getcontacts", { username:session.username, pin: session.pin }), 20000, "Loading contacts"),
      withTimeout(api("getusagecount", {}), 20000, "Loading usage").catch(() => ({ ok:false }))
    ]);
    clearTimeout(slowTimer);

    if(!contactsRes.ok){
      showToast(contactsRes.error || "Session expired, please log in again");
      session = null; saveSession();
      renderLogin();
      return;
    }
    contacts = contactsRes.contacts || [];
    setCachedContacts(contacts);
    if(usageRes.ok) usageCount = usageRes.usageCount;
    render();
    flushRetryQueue();
  }catch(err){
    clearTimeout(slowTimer);
    console.error(err);
    if(!cached){
      app.innerHTML = `<div class="wrap"><div class="notice danger">Could not reach the server: ${esc(err.message||"network error")}
        <button id="bootRetryBtn2" class="btn dark small" style="margin-left:8px">Retry</button></div></div>`;
      const rb = document.getElementById("bootRetryBtn2");
      if(rb) rb.onclick = boot;
    } else {
      showToast("Couldn't refresh — showing your last saved data");
    }
  }
}
function render(){
  if(!session){ renderLogin(); return; }
  if(session.role === "admin") renderAdmin(); else renderUser();
}

/* ---------------------- USER VIEW ---------------------- */
// Privacy: a field user must only ever see contacts assigned to them, never
// the whole database. This filters client-side by the AssignedTo column so
// it holds even if the backend response isn't already scoped per user.
function assignedContacts(){
  if(session.role === "admin") return contacts;
  const me = String(session.username||"").trim().toLowerCase();
  return contacts.filter(c => String(c.AssignedTo||"").trim().toLowerCase() === me);
}
function visibleContacts(){
  const hidden = getHiddenIds().map(String);
  return assignedContacts().filter(c => !hidden.includes(String(c.ID)));
}
function filteredContacts(){
  let list = visibleContacts().map((c) => ({...c, __i: contacts.indexOf(c)}));
  if(ui.statusFilter !== "All") list = list.filter(c => (c.Status || "Pending") === ui.statusFilter);
  if(ui.search){
    const q = ui.search.toLowerCase();
    list = list.filter(c => Object.values(c).join(" ").toLowerCase().includes(q));
  }
  return list;
}
/* ---------------------- Record navigation (buttons + keyboard share this) ---------------------- */
function goNextRecord(){ if(autoCall.active && autoCall.phase !== "idle") return; const list = filteredContacts(); ui.currentIndex = (ui.currentIndex+1) % Math.max(list.length,1); renderUser(); }
function goPrevRecord(){ if(autoCall.active && autoCall.phase !== "idle") return; const list = filteredContacts(); ui.currentIndex = (ui.currentIndex-1+list.length) % Math.max(list.length,1); renderUser(); }
function goFirstRecord(){ if(autoCall.active && autoCall.phase !== "idle") return; ui.currentIndex = 0; renderUser(); }
function goLastRecord(){ if(autoCall.active && autoCall.phase !== "idle") return; const list = filteredContacts(); ui.currentIndex = Math.max(list.length-1,0); renderUser(); }

/* ---------------------- USER BASE: jump directly to a customer by their ID ----------------------
   Looks up the ID against everything assigned to this user (ignoring the
   current search/status filter, since the number a field user is handed
   might not match whatever filter happens to be active), then clears the
   filter and opens straight to that record. */
function loadByUserBase(raw){
  const q = String(raw||"").trim();
  if(!q) return showToast("Enter a User Base number");
  const match = visibleContacts().find(c => String(c.ID).trim() === q);
  if(!match){ showToast(`No customer record found for User Base number "${q}".`); return; }
  ui.statusFilter = "All";
  ui.search = "";
  const idx = filteredContacts().findIndex(c => String(c.ID) === String(match.ID));
  ui.currentIndex = idx >= 0 ? idx : 0;
  ui.drawerOpen = false;
  renderUser();
  showToast(`Loaded customer ${match.ID} — ${match.Name || "Unnamed"}`);
}

function draftKey(){ return LS_DRAFT_PREFIX + session.username; }
function getDrafts(){ return JSON.parse(localStorage.getItem(draftKey()) || "{}"); }

function clearDraft(id){ const d = getDrafts(); delete d[id]; localStorage.setItem(draftKey(), JSON.stringify(d)); }

function focusEnd(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  const v = el.value; el.value=""; el.value=v;
}

// Tapping a status tab must always visibly respond immediately, even if the
// network is slow or the save fails — so we update the tab colour and local
// state right away, then sync to the sheet in the background and queue a
// retry if that sync fails, instead of leaving the tap looking "stuck".
async function saveRecord(rec, status, remarks){
  if(savingInFlight) return; // a save is already in progress — ignore repeat taps/Enter
  savingInFlight = true;

  const finalRemarks = remarks===undefined ? rec.Remarks : remarks;
  rec.Status = status;
  rec.Remarks = finalRemarks;
  ui.saveState = { id: rec.ID, phase: "saving" };
  renderUser(); // shows "Saving…" and disables Save immediately — never lies about success early

  const payload = { username:session.username, pin: session.pin, id:rec.ID, status, remarks: finalRemarks };
  let r;
  try{ r = await api("updatecontact", payload); }
  catch(e){ r = { ok:false, error:"network" }; }

  if(!r.ok){
    // Never lose the user's entered data: keep it queued for retry and keep
    // it visible in the draft store so a page reload can't wipe it either.
    queueForRetry(payload);
    setDraft(rec.ID, finalRemarks);
    ui.saveState = { id: rec.ID, phase: "error" };
    showToast(r.offline ? "No connection — saved on this device, will sync automatically" : `Unable to save (${r.error||"sheet error"}) — will retry automatically`);
  }else{
    clearDraft(rec.ID);
    ui.saveState = { id: rec.ID, phase: "saved" };
    showToast("Saved to Google Sheet");
  }
  savingInFlight = false;
  renderUser();

  if(ui.saveState && ui.saveState.phase === "saved"){
    const savedId = rec.ID;
    clearTimeout(saveRecord._clearTimer);
    saveRecord._clearTimer = setTimeout(() => {
      if(ui.saveState && ui.saveState.id === savedId && ui.saveState.phase === "saved"){ ui.saveState = null; renderUser(); }
    }, 2200);
  }
}

/* ---------------------- file upload: robust header matching ---------------------- */
// Reduce a header to just its letters/digits, lowercased, so "Mobile No.",
// "mobile_no", "Mobile No" and "MOBILE-NO" all normalize to "mobileno".
function normHeader(k){ return String(k||"").toLowerCase().replace(/[^a-z0-9]/g,""); }

const FIELD_MATCHERS = {
  name:    ["name","fullname","contactname","customername","clientname","personname","leadname"],
  mobile:  ["mobile","mobileno","mobilenumber","phone","phoneno","phonenumber","contact","contactno","contactnumber","primarymobile","number","mob"],
  alt:     ["alt","altmobile","altmobileno","altnumber","alternatemobile","alternatenumber","secondarymobile","mobile2","phone2"],
  address: ["address","addr","location","city","area"],
};

function mapRow(rawRow){
  const norm = {};
  Object.keys(rawRow).forEach(k => { norm[normHeader(k)] = rawRow[k]; });
  const pick = (keys) => {
    for(const k of keys){ if(norm[k]!==undefined && String(norm[k]).trim()!=="") return String(norm[k]).trim(); }
    return "";
  };
  return {
    name: pick(FIELD_MATCHERS.name),
    mobile: pick(FIELD_MATCHERS.mobile),
    alt: pick(FIELD_MATCHERS.alt),
    address: pick(FIELD_MATCHERS.address),
  };
}

function parseSpreadsheetFile(file){
  return new Promise((resolve, reject) => {
    const ext = file.name.toLowerCase().split(".").pop();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read that file"));
    reader.onload = ev => {
      try{
        let wb;
        if(ext === "csv"){
          // Strip a UTF-8 BOM if present — otherwise the very first header
          // (usually "name") silently fails to match and every row gets skipped.
          let text = String(ev.target.result || "");
          if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          wb = XLSX.read(text, { type:"string" });
        }else{
          wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array" });
        }
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { defval:"" });
        const rawHeaders = rawRows.length ? Object.keys(rawRows[0]) : [];
        const rows = rawRows.map(mapRow).filter(r => r.name || r.mobile);
        resolve({ rows, rawHeaders, rawCount: rawRows.length });
      }catch(err){ reject(err); }
    };
    if(ext === "csv") reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}

function bindFileUpload(){
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("filePreview");
  const replaceBtn = document.getElementById("uploadReplaceBtn");
  const appendBtn = document.getElementById("uploadAppendBtn");
  if(!fileInput) return;
  let parsed = null;

  fileInput.onchange = async () => {
    parsed = null;
    replaceBtn.disabled = true; appendBtn.disabled = true;
    const file = fileInput.files && fileInput.files[0];
    if(!file) { preview.innerHTML = ""; return; }
    preview.innerHTML = "Reading file…";
    try{
      const result = await parseSpreadsheetFile(file);
      parsed = result;
      if(!result.rows.length){
        preview.innerHTML = `<span style="color:var(--red)">Found ${result.rawCount} row(s) but couldn't find a name or mobile column.</span>
          Detected headers: ${result.rawHeaders.length ? esc(result.rawHeaders.join(", ")) : "(none — is the first row empty?)"}.
          Rename your columns to something like "Name" and "Mobile" and re-select the file.`;
      }else{
        const sample = result.rows.slice(0,3).map(r => `${esc(r.name||"—")} · ${esc(r.mobile||"—")}`).join("<br/>");
        preview.innerHTML = `<span style="color:var(--green)">Read ${result.rows.length} usable row(s) out of ${result.rawCount}.</span><br/>
          Preview: <br/>${sample}${result.rows.length>3 ? "<br/>…" : ""}`;
        replaceBtn.disabled = false; appendBtn.disabled = false;
      }
    }catch(err){
      console.error(err);
      preview.innerHTML = `<span style="color:var(--red)">Could not read that file — make sure it's a valid CSV or XLSX.</span>`;
    }
  };

  const runUpload = async (mode) => {
    if(!parsed || !parsed.rows.length) return showToast("Choose a valid file first");
    replaceBtn.disabled = true; appendBtn.disabled = true;
    const r = await api("uploadcontacts", { username:session.username, pin:session.pin, rows:parsed.rows, mode });
    if(!r.ok){ showToast(r.error || "Upload failed"); replaceBtn.disabled = false; appendBtn.disabled = false; return; }
    showToast(`Uploaded. Total now ${r.total}`);
    boot();
  };
  replaceBtn.onclick = () => {
    if(!confirm(`Replace the ENTIRE database with these ${parsed.rows.length} contacts? This overwrites what's currently in the sheet.`)) return;
    runUpload("replace");
  };
  appendBtn.onclick = () => runUpload("append");
}

/* ---------------------- Keyboard shortcuts (field-user record navigation) ----------------------
   Bound once, globally — not re-bound on every render. Only acts when a
   field user is logged in and a customer card is open, and never hijacks
   typing in inputs/textareas/selects (so Search, Remarks, PIN, etc. are
   completely unaffected). Enter → Save, → → Next, ← → Previous. */
document.addEventListener("keydown", (e) => {
  if(!session || session.role !== "user") return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const list = filteredContacts();
  if(!list.length) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); goNextRecord(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); goPrevRecord(); }
  else if(e.key === "Enter"){
    const rec = list[ui.currentIndex];
    if(rec){ e.preventDefault(); saveRecord(rec, rec.Status || "Pending", (getDrafts()[rec.ID] !== undefined ? getDrafts()[rec.ID] : (rec.Remarks||""))); }
  }
});

/* ---------------------- Idle auto-logout ----------------------
   The session (including the PIN) lives in localStorage for as long as
   someone stays logged in — that's required since every API call needs
   the PIN (there's no separate session token from the backend). Auto-
   logging out after inactivity limits how long that sits exposed on a
   device that's left unlocked or walked away from. */
const SESSION_IDLE_LIMIT_MS = 20 * 60 * 1000; // 20 minutes
let lastActivityAt = Date.now();
["click","keydown","mousemove","touchstart","scroll"].forEach(evt =>
  document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive:true })
);
setInterval(() => {
  if(session && (Date.now() - lastActivityAt) > SESSION_IDLE_LIMIT_MS){
    session = null; saveSession();
    showToast("Logged out after 20 minutes of inactivity");
    renderLogin();
  }
}, 30000);

boot();
})();
</script>
</body>
</html>
